services:
  - type: web
    name: salvage-pulse-wheelie
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CALCOM_URL
        value: https://cal.com/gen-keech-avipdc/live-demo
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
